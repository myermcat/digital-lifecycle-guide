<svg viewBox="0 20 900 334" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ac_ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C7B63"/></marker>
    <marker id="ac_arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A8492A"/></marker>
  </defs>

  <!-- the one action you always do -->
  <rect x="285" y="34" width="330" height="66" rx="12" fill="#FBF6EC" stroke="#A8492A" stroke-width="2"/>
  <text x="450" y="61" text-anchor="middle" font-size="16" font-weight="700" fill="#A8492A">Consultez votre bureau de la GI</text>
  <text x="450" y="83" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#6B5B49">« Une autorisation existe-t-elle déjà ? »</text>

  <!-- branch arrows -->
  <path d="M380,100 C300,132 250,150 232,176" fill="none" stroke="#8C7B63" stroke-width="2" marker-end="url(#ac_ar)"/>
  <path d="M520,100 C620,132 660,150 678,176" fill="none" stroke="#A8492A" stroke-width="2" marker-end="url(#ac_arR)"/>
  <text x="270" y="132" text-anchor="end" font-size="13" font-family="Arial, sans-serif" font-weight="700" letter-spacing="0.5" fill="#8C7B63">SOUVENT</text>
  <text x="648" y="132" text-anchor="start" font-size="13" font-family="Arial, sans-serif" font-weight="700" letter-spacing="0.5" fill="#A8492A">PARFOIS</text>

  <!-- LEFT: already covered -->
  <rect x="40" y="188" width="380" height="150" rx="12" fill="#F3ECDD" stroke="#C9B99B" stroke-width="1.8"/>
  <circle cx="72" cy="217" r="11" fill="#7C8A5A"/><path d="M66,217 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="222" font-size="16" font-weight="700" fill="#4A3B2E">Déjà couvert</text>
  <text x="62" y="253" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">Une autorisation que le ministère détient</text>
  <text x="62" y="275" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">déjà pour ce type de document, ou une</text>
  <text x="62" y="297" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">autorisation commune pour les dossiers.</text>
  <text x="62" y="322" font-size="14.5" font-family="Arial, sans-serif" font-weight="700" fill="#6B5B49">Rien à demander. Il suffit de la confirmer.</text>

  <!-- RIGHT: not covered -->
  <rect x="480" y="188" width="380" height="150" rx="12" fill="#FBF1EA" stroke="#A8492A" stroke-width="1.8"/>
  <circle cx="512" cy="217" r="11" fill="#A8492A"/><text x="512" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">!</text>
  <text x="532" y="222" font-size="16" font-weight="700" fill="#4A3B2E">Non couvert</text>
  <text x="502" y="253" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">Demandez une nouvelle autorisation pour les</text>
  <text x="502" y="275" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">documents de votre programme, via la GI.</text>
  <text x="502" y="300" font-size="14.5" font-family="Arial, sans-serif" font-weight="700" fill="#A8492A">Commencez tôt</text><text x="614" y="300" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">— aucun délai fixé ;</text>
  <text x="502" y="322" font-size="14.5" font-family="Arial, sans-serif" fill="#3A3229">cela peut prendre des mois, voire des années.</text>
</svg>
