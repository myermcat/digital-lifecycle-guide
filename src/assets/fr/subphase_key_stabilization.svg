<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
<rect x="12" y="26" width="276" height="188" rx="16" fill="#ECDFCD" stroke="#A8492A" stroke-width="2"/>
<g transform="translate(128,60) scale(1.85)" fill="none" stroke="#A8492A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></g>
<text x="150" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#A8492A">Le surveiller chaque jour</text>
<text x="150" y="166" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">la pleine charge révèle ce que</text>
<text x="150" y="185" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">les tests ont manqué</text>
<rect x="312" y="26" width="276" height="188" rx="16" fill="#ECDFCD" stroke="#A8492A" stroke-width="2"/>
<g transform="translate(428,60) scale(1.85)" fill="none" stroke="#A8492A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
<text x="450" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#A8492A">Corriger vite</text>
<text x="450" y="166" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">ceux qui l'ont construit</text>
<text x="450" y="185" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">sont encore de garde</text>
<rect x="612" y="26" width="276" height="188" rx="16" fill="#ECDFCD" stroke="#A8492A" stroke-width="2"/>
<g transform="translate(728,60) scale(1.85)" fill="none" stroke="#A8492A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></g>
<text x="750" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#A8492A">Régler les restes</text>
<text x="750" y="166" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">inscriptions, transfert,</text>
<text x="750" y="185" text-anchor="middle" font-size="13" font-style="italic" fill="#4A3B2E">l'ancienne façon encore active</text>
