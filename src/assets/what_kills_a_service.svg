<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">

<text x="20" y="30" font-size="12.5" font-weight="bold" fill="#A8492A" letter-spacing="1.2">WHERE THE RISK USUALLY IS</text>

<rect x="20" y="44" width="860" height="96" rx="10" fill="#ECDFCD" stroke="#A8492A" stroke-width="2"/>
<text x="40" y="70" font-size="13" fill="#4A3B2E">Policy does not allow it</text>
<text x="40" y="94" font-size="13" fill="#4A3B2E">Nobody has the legal authority</text>
<text x="40" y="118" font-size="13" fill="#4A3B2E">The data does not exist</text>
<text x="470" y="70" font-size="13" fill="#4A3B2E">People will not use this channel</text>
<text x="470" y="94" font-size="13" fill="#4A3B2E">Another department owns a step</text>
<text x="470" y="118" font-size="13" font-style="italic" fill="#8C7B63">None of these are in the software</text>

<text x="20" y="186" font-size="12.5" font-weight="bold" fill="#8C7B63" letter-spacing="1.2">WHERE TEAMS USUALLY SPEND ALPHA</text>

<rect x="20" y="200" width="860" height="52" rx="10" fill="#FBF7EF" stroke="#C9BBA4" stroke-width="1.8"/>
<text x="40" y="224" font-size="13" fill="#4A3B2E">Building and testing the prototype</text>
<text x="40" y="243" font-size="12.5" font-style="italic" fill="#8C7B63">because it is the part you can see</text>

<path d="M450 148 l0 44" stroke="#A8492A" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
<path d="M450 198 l-6 -10 h12 z" fill="#A8492A"/>
<text x="466" y="176" font-size="12.5" font-style="italic" fill="#A8492A">the mismatch</text>

<text x="450" y="292" text-anchor="middle" font-size="14.5" font-style="italic" fill="#8C7B63">A technical no can end an idea. It is one reason among many, and the ones above are the easiest to miss.</text>
</svg>
